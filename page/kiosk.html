<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status Wall</title>
  <style>
    /* hostwerk-allow: colors, fonts – Kiosk-Wand (/v/status-wall/) läuft ohne Hostwerk im Vollbild: eigene Farben (hell/dunkel, AA-Kontrast), Systemschrift */
    :root { --bg: #0b1220; --card: #111a2e; --line: #26324d; --fg: #f1f5f9; --muted: #a3b1c9; --ok: #4ade80; --err: #f87171; --warn: #fbbf24; --accent: #38bdf8; --min: 240px; --name: 20px; }
    :root[data-theme="light"] { --bg: #f4f6fb; --card: #ffffff; --line: #d6dce8; --fg: #0f172a; --muted: #475569; --ok: #15803d; --err: #b91c1c; --warn: #a16207; --accent: #0369a1; }
    :root[data-size="compact"] { --min: 180px; --name: 16px; }
    :root[data-size="wall"] { --min: 320px; --name: 28px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { padding: 16px 20px; }
    header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    header .grow { flex: 1; min-width: 200px; }
    h1 { margin: 0; font-size: 22px; }
    .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .clock { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .btn { min-height: 32px; min-width: 32px; padding: 4px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 14px; cursor: pointer; }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
    .stat .k { color: var(--muted); font-size: 13px; }
    .stat .v { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
    h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--min), 1fr)); gap: 12px; }
    .tile { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .tile.running { border-color: var(--ok); }
    .tile.error { border-color: var(--err); }
    .tile.stopped { border-style: dashed; }
    .tile .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .tile .name { font-size: var(--name); font-weight: 700; margin: 4px 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.err { color: var(--err); border-color: var(--err); }
    .badge.warn { color: var(--warn); border-color: var(--warn); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .meta { color: var(--muted); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .spark { display: block; width: 100%; height: 24px; margin-top: 8px; }
    .spark polyline { fill: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .spark .cpu { stroke: var(--accent); }
    .spark .mem { stroke: var(--muted); stroke-dasharray: 3 2; }
    .note { color: var(--muted); font-size: 15px; }
    .note.warn { color: var(--warn); }
  </style>
</head>
<body>
  <header>
    <div class="grow"><h1 id="title"></h1><div class="sub" id="sub" aria-live="polite"></div></div>
    <button type="button" class="btn" id="full" hidden></button>
    <div class="clock" id="clock"></div>
  </header>
  <div class="summary" id="summary"></div>
  <p class="note" id="note" hidden></p>
  <div id="groups"></div>
  <script src="lib.js"></script>
  <script src="kiosk.js"></script>
</body>
</html>
