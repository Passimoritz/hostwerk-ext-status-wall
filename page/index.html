<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ext-sdk.js"></script>
  <style>
    .summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .tile { border-width: 2px; transition: border-color .2s, transform .15s; }
    .tile.running { border-color: color-mix(in srgb, var(--ok) 55%, var(--hw-line)); }
    .tile.error { border-color: color-mix(in srgb, var(--err) 60%, var(--hw-line)); }
    .tile.stopped { opacity: .75; }
    .tile .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .tile .name { font-size: 18px; font-weight: 700; margin: 4px 0 6px; }
    .tile .meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
    .tile .actions { margin-top: 12px; display: flex; gap: 6px; }
    body.size-compact .grid-auto { --hw-min: 190px; } body.size-compact .tile .name { font-size: 15px; }
    body.size-wall .grid-auto { --hw-min: 300px; } body.size-wall .tile { padding: 24px; } body.size-wall .tile .name { font-size: 26px; }
    .clock { font-size: 28px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="row">
    <div class="grow"><p class="muted" id="sub" data-i18n="loading"></p></div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="summary" id="summary"></div>
  <div id="groups" class="stack"><div class="hw-skeleton" style="height:120px"></div></div>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
