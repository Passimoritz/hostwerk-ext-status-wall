<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/ext-sdk.js"></script>
  <style>
    .ring { display: flex; align-items: center; gap: var(--sp-3, 12px); }
    .ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 7; }
    .ring .track { stroke: var(--hw-surface-3); }
    .ring .bar { stroke: var(--ok); stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
    .big { font-size: var(--fs-xl, 20px); font-weight: 700; }
    .problem { display: flex; gap: var(--sp-2, 8px); align-items: center; font-size: var(--fs-xs, 12px); padding: var(--sp-1, 4px) 0; }
    @media (prefers-reduced-motion: reduce) { .ring .bar { transition: none; } }
  </style>
</head>
<body>
  <div class="ring">
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle class="track" cx="32" cy="32" r="26"/><circle class="bar" id="bar" cx="32" cy="32" r="26" stroke-dasharray="163.4" stroke-dashoffset="163.4"/></svg>
    <div><div class="big" id="count" aria-live="polite">–</div><div class="muted small" id="label" data-i18n="servicesRunning"></div></div>
  </div>
  <div id="problems" style="margin-top: var(--sp-2, 8px)"></div>
  <div id="uptime" class="problem" hidden></div>
  <script src="../page/lib.js"></script>
  <script src="../page/uptime-lib.js"></script>
  <script>
    const { html, t } = Hostwerk;
    async function load() {
      let all;
      try { all = StatusWall.fromOverview(await Hostwerk.get('/overview')); } catch {
        // Kurz sagen, was los ist, und „Erneut versuchen“ anbieten – statt eines „–“, das ewig stehen bleibt
        document.getElementById('count').textContent = '–';
        Hostwerk.render('#problems', html`<div class="small">${t('widgetFailed')} <button type="button" class="btn xs" id="retry">${t('retry')}</button></div>`);
        document.getElementById('retry').addEventListener('click', load);
        return;
      }
      const sum = StatusWall.summary(all);
      document.getElementById('count').textContent = `${Hostwerk.fmt.number(sum.running)} / ${Hostwerk.fmt.number(sum.total)}`;
      document.getElementById('bar').setAttribute('stroke-dashoffset', String(163.4 * (1 - (sum.total ? sum.running / sum.total : 0))));
      const bad = all.filter((s) => s.state === 'error');
      Hostwerk.render('#problems', bad.length ? html`${bad.slice(0, 4).map((s) => html`<div class="problem"><span class="dot err"></span>${s.name}</div>`)}`
        : sum.busy ? html`<div class="muted small">${t('widgetBusy', { n: sum.busy })}</div>` : html`<div class="muted small">${t('allGood')}</div>`);
    }
    // 2.0: eine Zeile Erreichbarkeit (bis 1.5 eigene Kachel der Uptime-Wand) – Einstellung „tileUptime“
    async function loadUptime() {
      const box = document.getElementById('uptime');
      const st = await Hostwerk.settings.get().catch(() => ({}));
      const d = st.tileUptime === false ? null : await Hostwerk.get('/live/uptime').catch(() => null);
      const checks = (d && Array.isArray(d.checks)) ? d.checks : [];
      box.hidden = !checks.length;
      if (box.hidden) return;
      const o = Uptime.overall(checks);
      Hostwerk.render(box, html`<span class="dot ${o.down ? 'err' : 'ok'}"></span>${o.down ? t('up.someDown', { n: o.down }) : t('up.allUp')}`);
    }
    const both = () => { load(); loadUptime().catch(() => {}); };
    // Alle 20 s nachladen – nicht, solange die Übersicht verborgen ist
    Hostwerk.ready().then(() => { both(); Hostwerk.on('service', load); Hostwerk.on('lang', both); Hostwerk.on('settings', both); setInterval(() => { if (!document.hidden) both(); }, 20000); });
  </script>
</body>
</html>
